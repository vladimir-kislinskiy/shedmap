<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Shed Map — Sign in</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
	<meta name="description" content="Shed Map sign-in. Contact Vlad for access.">
	<meta name="robots" content="noindex, nofollow">
	@include('partials/connected/favicon.html')
	<style>
		:root {
			--bg: #eef1f5;
			--surface: #ffffff;
			--text: #1e293b;
			--muted: #64748b;
			--primary: #1f3a5f;
			--primary-hover: #16304f;
			--border: #e2e8f0;
			--error: #a84d48;
			--radius: 16px;
			--font: "Saira Semi Condensed", system-ui, -apple-system, "Segoe UI", sans-serif;
		}
		* { box-sizing: border-box; }
		html {
			height: 100%;
		}
		html, body {
			margin: 0;
			font-family: var(--font);
			font-size: 15px;
			color: var(--text);
			background: linear-gradient(135deg, #f4f6f9 0%, var(--bg) 100%);
		}
		body {
			min-height: 100%;
			min-height: 100dvh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px 16px;
		}
		.gate {
			width: 100%;
			max-width: 400px;
			margin: auto;
			padding: 32px 28px 28px;
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			box-shadow: 0 12px 40px rgba(15, 23, 42, 0.1);
		}
		.gate__title {
			margin: 0 0 8px;
			font-size: 1.35rem;
			font-weight: 700;
			color: var(--primary);
		}
		.gate__hint {
			margin: 0 0 22px;
			line-height: 1.45;
			color: var(--muted);
			font-size: 0.95rem;
		}
		.gate__hint a {
			color: var(--primary);
			font-weight: 600;
			text-decoration: none;
		}
		.gate__hint a:hover { text-decoration: underline; }
		.gate__form {
			display: flex;
			flex-direction: column;
			gap: 12px;
		}
		.gate__input {
			width: 100%;
			height: 44px;
			padding: 0 12px;
			border: 1px solid var(--border);
			border-radius: 8px;
			font: inherit;
			color: var(--text);
			background: #fff;
		}
		.gate__input:focus {
			outline: 2px solid rgba(31, 58, 95, 0.25);
			border-color: var(--primary);
		}
		.gate__password-wrap {
			position: relative;
		}
		.gate__input--password {
			padding-right: 48px;
		}
		.gate__toggle {
			position: absolute;
			top: 50%;
			right: 8px;
			transform: translateY(-50%);
			width: 36px;
			height: 36px;
			border: none;
			border-radius: 6px;
			background: transparent;
			color: var(--muted);
			cursor: pointer;
			font-size: 0.75rem;
			font-weight: 600;
		}
		.gate__error {
			margin: 0;
			min-height: 1.2em;
			color: var(--error);
			font-size: 0.88rem;
			font-weight: 600;
		}
		.gate__error[hidden] { display: none; }
		.gate__submit {
			height: 44px;
			border: none;
			border-radius: 8px;
			background: var(--primary);
			color: #fff;
			font: inherit;
			font-weight: 700;
			cursor: pointer;
		}
		.gate__submit:hover:not(:disabled) { background: var(--primary-hover); }
		.gate__submit:disabled { opacity: 0.65; cursor: wait; }
	</style>
</head>
<body>
	<main class="gate" role="dialog" aria-labelledby="gateTitle" aria-modal="true">
		<h1 class="gate__title" id="gateTitle">Shed Map — Sign in</h1>
		<p class="gate__hint">
			Access is restricted. For a login and password, contact
			<strong>Vlad</strong>
			(<a href="mailto:operations@barr-ag.com">operations@barr-ag.com</a>)
			or
			<a href="tel:+14039946264">403-994-6264</a>
			(phone &amp; WhatsApp).
		</p>
		<form class="gate__form" id="loginForm" novalidate>
			<input type="email" id="loginEmail" class="gate__input" name="username"
				placeholder="Email" autocomplete="username" autocapitalize="off"
				autocorrect="off" spellcheck="false" required readonly>
			<div class="gate__password-wrap">
				<input type="password" id="loginPassword" class="gate__input gate__input--password"
					name="password" placeholder="Password" autocomplete="current-password"
					required readonly>
				<button type="button" class="gate__toggle" id="loginPasswordToggle"
					aria-label="Show password" aria-pressed="false">Show</button>
			</div>
			<p class="gate__error" id="loginError" hidden></p>
			<button type="submit" class="gate__submit" id="loginSubmit">Sign In</button>
		</form>
	</main>
	<script type="module" src="js/login-gate.js"></script>
</body>
</html>
