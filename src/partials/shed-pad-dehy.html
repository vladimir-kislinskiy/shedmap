<div class="shed__bay dehy-pad" data-bay="@index" data-num="@label">
	<div class="shed__bay-label dehy-pad__label">@label</div>
	<div class="shed__bay-stack dehy-pad__stack" id="dehy-col-@index" data-location="olds" data-shed="dehy" data-bay="@index">
		<div class="shed__isles">
			<div class="shed__isle shed__isle--1" data-isle="1"></div>
			<div class="shed__isle shed__isle--2" data-isle="2"></div>
		</div>
		<div class="shed__bay-stack-tail" aria-hidden="true"></div>
	</div>
	<div class="shed__bay-stats dehy-pad__stats">
		<div class="shed__bay-total"><span class="shed__bay-total-val">0</span></div>
	</div>
</div>
